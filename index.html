<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaiOS Web App Runner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for in-browser .zip / .omni archive extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Inter & JetBrains Mono fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            canvas: '#09090b',
            surface: '#18181b',
            border: '#27272a',
            accent: '#10b981',
          }
        }
      }
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #09090b;
      color: #fafafa;
      overflow: hidden;
      user-select: none;
    }

    /* Crisp viewport frame with zero decorative phone chrome */
    #viewport-shell {
      width: 240px;
      height: 320px;
      transition: width 0.2s cubic-bezier(0.22, 1, 0.36, 1), height 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.15s ease;
    }

    #viewport-shell.landscape {
      width: 320px;
      height: 240px;
    }

    #viewport-shell.drag-over {
      border-color: #10b981;
      background-color: rgba(16, 185, 129, 0.06);
    }

    /* Ensure iframe fills the exact 240x320 or 320x240 logical pixel canvas */
    #app-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000000;
    }
  </style>
</head>
<body class="bg-canvas text-[#fafafa] font-sans flex flex-col items-center justify-center min-h-screen p-4">

  <!-- Main Centered Workspace -->
  <main class="flex flex-col items-center justify-center gap-4 w-full max-w-md">

    <!-- Unencumbered 240x320 / 320x240 Viewport -->
    <div
      id="viewport-shell"
      class="relative bg-surface border border-border rounded-lg overflow-hidden shadow-2xl flex items-center justify-center"
      tabindex="0"
      aria-label="KaiOS Application Viewport"
    >
      <!-- Empty State: Interactive Drag & Drop + File Loader -->
      <div
        id="dropzone"
        class="w-full h-full flex flex-col items-center justify-between p-4 text-center cursor-pointer transition-colors hover:bg-zinc-900/70"
        role="button"
        tabindex="0"
        aria-label="Drop or select a KaiOS app package"
      >
        <div class="w-full flex items-center justify-between text-[10px] font-mono text-zinc-500">
          <span id="dim-indicator">240×320</span>
          <span>B2G / KAIOS</span>
        </div>

        <div class="flex flex-col items-center gap-2.5 my-auto px-2">
          <div class="w-10 h-10 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-accent">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div>
            <p class="text-xs font-medium text-zinc-200 tracking-tight">Drop KaiOS Package</p>
            <p class="text-[11px] text-zinc-500 mt-0.5 leading-snug">
              .zip, .omni, .webapp, or .html
            </p>
          </div>
          <button
            id="btn-sample"
            type="button"
            class="mt-1 px-2.5 py-1.5 rounded-md bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 hover:border-zinc-700 text-[11px] font-medium text-accent transition-colors"
          >
            Load Sample KaiOS App
          </button>
        </div>

        <!-- Subtle Error / Loading Feedback inside Dropzone Only -->
        <div id="loader-feedback" class="w-full text-[10px] font-mono text-zinc-500 truncate min-h-[14px]">
          * LSK · # RSK · ARROWS · ENTER
        </div>
      </div>

      <!-- Sandboxed App Iframe (100% free of status bars or overlays when active) -->
      <iframe
        id="app-frame"
        class="hidden"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"
        title="KaiOS Running Application"
      ></iframe>
    </div>

    <!-- Compact 4-Button Control Strip Outside Viewport -->
    <nav
      aria-label="Emulator Controls"
      class="flex items-center justify-center gap-1.5 bg-surface border border-border rounded-lg p-1.5 shadow-lg"
    >
      <button
        id="btn-load"
        type="button"
        title="Load App Package (.zip, .omni, .html)"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-200 hover:text-white hover:bg-zinc-800 active:bg-zinc-700 transition-colors cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Load App</span>
      </button>

      <div class="w-px h-4 bg-zinc-800"></div>

      <button
        id="btn-reload"
        type="button"
        disabled
        title="Reload Current App"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-200 hover:text-white hover:bg-zinc-800 active:bg-zinc-700 disabled:opacity-35 disabled:pointer-events-none transition-colors cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>Reload</span>
      </button>

      <div class="w-px h-4 bg-zinc-800"></div>

      <button
        id="btn-rotate"
        type="button"
        title="Toggle 240x320 / 320x240 Orientation"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-200 hover:text-white hover:bg-zinc-800 active:bg-zinc-700 transition-colors cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="12" height="18" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
        <span>Rotate</span>
      </button>

      <div class="w-px h-4 bg-zinc-800"></div>

      <button
        id="btn-eject"
        type="button"
        disabled
        title="Unload / Eject App"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-zinc-200 hover:text-rose-400 hover:bg-zinc-800 active:bg-zinc-700 disabled:opacity-35 disabled:pointer-events-none transition-colors cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 15 12 6 19 15 5 15"/>
          <line x1="5" y1="19" x2="19" y2="19"/>
        </svg>
        <span>Eject</span>
      </button>
    </nav>

    <!-- Hidden File Input -->
    <input
      id="file-input"
      type="file"
      accept=".zip,.omni,.webapp,.html,.htm,application/zip,application/x-zip-compressed,text/html"
      class="hidden"
    />
  </main>

  <script>
    /**
     * KaiOS Web App Runner / Emulator
     * Architecture:
     * 1. PackageEngine: Unpacks .zip / .omni (including nested application.zip) or standalone .html,
     *    parses manifest.webapp / manifest.webmanifest, builds a Virtual File System (VFS) of Blob URLs,
     *    and rewrites relative asset references in HTML & CSS.
     * 2. GeckoRuntimeShim: Injected at top of <head> inside the target document to polyfill KaiOS 2.5/3.0
     *    APIs (mozApps, mozAlarms, getDeviceStorage, MozActivity/WebActivity, window.close) and intercept
     *    fetch/XHR/Image/Audio requests to resolve against the VFS map.
     * 3. KeypadController: Maps * -> SoftLeft, # -> SoftRight, Arrows -> D-pad, Enter -> Enter,
     *    Backspace/Escape -> Backspace, 0-9 -> Digits, and keeps focus locked inside the active iframe.
     */
    (function () {
      'use strict';

      // DOM References
      const viewportShell = document.getElementById('viewport-shell');
      const dropzone = document.getElementById('dropzone');
      const appFrame = document.getElementById('app-frame');
      const fileInput = document.getElementById('file-input');
      const loaderFeedback = document.getElementById('loader-feedback');
      const dimIndicator = document.getElementById('dim-indicator');

      const btnLoad = document.getElementById('btn-load');
      const btnReload = document.getElementById('btn-reload');
      const btnRotate = document.getElementById('btn-rotate');
      const btnEject = document.getElementById('btn-eject');
      const btnSample = document.getElementById('btn-sample');

      // Runtime State
      let currentSource = null; // { type: 'file' | 'blob', file: File|Blob, name: string }
      let activeBlobUrls = [];
      let isLandscape = false;
      let isAppRunning = false;

      // MIME Type Lookup Table
      const MIME_TYPES = {
        html: 'text/html;charset=utf-8',
        htm: 'text/html;charset=utf-8',
        css: 'text/css;charset=utf-8',
        js: 'application/javascript;charset=utf-8',
        mjs: 'application/javascript;charset=utf-8',
        json: 'application/json;charset=utf-8',
        webapp: 'application/x-web-app-manifest+json;charset=utf-8',
        webmanifest: 'application/manifest+json;charset=utf-8',
        png: 'image/png',
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        gif: 'image/gif',
        svg: 'image/svg+xml',
        webp: 'image/webp',
        ico: 'image/x-icon',
        bmp: 'image/bmp',
        mp3: 'audio/mpeg',
        ogg: 'audio/ogg',
        oga: 'audio/ogg',
        wav: 'audio/wav',
        m4a: 'audio/mp4',
        aac: 'audio/aac',
        opus: 'audio/opus',
        mp4: 'video/mp4',
        webm: 'video/webm',
        woff: 'font/woff',
        woff2: 'font/woff2',
        ttf: 'font/ttf',
        otf: 'font/otf',
        eot: 'application/vnd.ms-fontobject',
        xml: 'application/xml',
        txt: 'text/plain;charset=utf-8',
        wasm: 'application/wasm'
      };

      function getMimeType(filename) {
        const clean = filename.split('?')[0].split('#')[0];
        const ext = clean.includes('.') ? clean.split('.').pop().toLowerCase() : '';
        return MIME_TYPES[ext] || 'application/octet-stream';
      }

      function normalizePath(path) {
        if (!path) return '';
        let p = path.split('?')[0].split('#')[0].trim();
        p = p.replace(/\\/g, '/');
        if (p.startsWith('/')) p = p.slice(1);
        const parts = p.split('/');
        const stack = [];
        for (const part of parts) {
          if (!part || part === '.') continue;
          if (part === '..') {
            stack.pop();
          } else {
            stack.push(part);
          }
        }
        return stack.join('/');
      }

      function resolveRelativePath(baseFile, relUrl) {
        if (!relUrl) return relUrl;
        const trimmed = relUrl.trim();
        // Ignore external protocols, data URIs, blob URIs, anchors
        if (/^(https?:|data:|blob:|mailto:|tel:|javascript:|#)/i.test(trimmed)) {
          return null;
        }
        const suffixMatch = trimmed.match(/([?#].*)$/);
        const suffix = suffixMatch ? suffixMatch[1] : '';
        const cleanUrl = trimmed.replace(/[?#].*$/, '');

        if (cleanUrl.startsWith('/')) {
          return { normalized: normalizePath(cleanUrl), suffix };
        }
        const baseDir = baseFile.includes('/') ? baseFile.substring(0, baseFile.lastIndexOf('/')) : '';
        const combined = baseDir ? `${baseDir}/${cleanUrl}` : cleanUrl;
        return { normalized: normalizePath(combined), suffix };
      }

      function registerBlobUrl(blob) {
        const url = URL.createObjectURL(blob);
        activeBlobUrls.push(url);
        return url;
      }

      function revokeAllBlobUrls() {
        for (const url of activeBlobUrls) {
          try {
            URL.revokeObjectURL(url);
          } catch (_) {}
        }
        activeBlobUrls = [];
      }

      function setFeedback(msg, isError = false) {
        loaderFeedback.textContent = msg;
        loaderFeedback.className = isError
          ? 'w-full text-[10px] font-mono text-rose-400 truncate min-h-[14px]'
          : 'w-full text-[10px] font-mono text-zinc-500 truncate min-h-[14px]';
      }

      /**
       * Generates the Gecko / B2G Compatibility Shim & Keypad/VFS Runtime
       * injected directly into the top of the app's <head>.
       */
      function buildRuntimeShimScript(vfsMap, manifestData, launchPath) {
        const serializedVfs = JSON.stringify(vfsMap);
        const serializedManifest = JSON.stringify(manifestData || {
          name: 'KaiOS App',
          launch_path: '/' + launchPath,
          version: '1.0.0'
        });
        const serializedLaunchPath = JSON.stringify(launchPath || 'index.html');

        return `<script data-kaios-runtime="true">
(function() {
  'use strict';
  if (window.__KAIOS_SHIM_INSTALLED__) return;
  window.__KAIOS_SHIM_INSTALLED__ = true;

  var VFS_MAP = ${serializedVfs};
  var MANIFEST = ${serializedManifest};
  var LAUNCH_PATH = ${serializedLaunchPath};

  // --- 1. Path & Virtual File Resolver ---
  function normalizeVfsPath(raw) {
    if (!raw || typeof raw !== 'string') return '';
    if (/^(https?:|data:|blob:|about:|javascript:|#)/i.test(raw)) return null;
    var clean = raw.split('?')[0].split('#')[0].replace(/\\\\/g, '/').trim();
    if (!clean) return null;
    if (clean.charAt(0) === '/') {
      clean = clean.slice(1);
    } else {
      var baseDir = LAUNCH_PATH.indexOf('/') !== -1 ? LAUNCH_PATH.substring(0, LAUNCH_PATH.lastIndexOf('/')) : '';
      clean = baseDir ? (baseDir + '/' + clean) : clean;
    }
    var parts = clean.split('/');
    var stack = [];
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part || part === '.') continue;
      if (part === '..') stack.pop();
      else stack.push(part);
    }
    return stack.join('/');
  }

  function resolveVfsUrl(url) {
    if (typeof url !== 'string') return url;
    var suffixMatch = url.match(/([?#].*)$/);
    var suffix = suffixMatch ? suffixMatch[1] : '';
    var norm = normalizeVfsPath(url);
    if (norm && Object.prototype.hasOwnProperty.call(VFS_MAP, norm)) {
      return VFS_MAP[norm] + suffix;
    }
    // Also check direct root-relative lookup
    var stripped = url.split('?')[0].split('#')[0].replace(/^\\.\\//, '').replace(/^\\//, '');
    if (Object.prototype.hasOwnProperty.call(VFS_MAP, stripped)) {
      return VFS_MAP[stripped] + suffix;
    }
    return url;
  }

  // Intercept fetch()
  if (window.fetch) {
    var origFetch = window.fetch.bind(window);
    window.fetch = function(input, init) {
      if (typeof input === 'string') {
        input = resolveVfsUrl(input);
      } else if (input && typeof Request !== 'undefined' && input instanceof Request) {
        var resolved = resolveVfsUrl(input.url);
        if (resolved !== input.url) {
          input = new Request(resolved, input);
        }
      }
      return origFetch(input, init);
    };
  }

  // Intercept XMLHttpRequest.prototype.open
  if (window.XMLHttpRequest) {
    var origXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
      var args = Array.prototype.slice.call(arguments);
      if (typeof url === 'string') {
        args[1] = resolveVfsUrl(url);
      }
      return origXhrOpen.apply(this, args);
    };
  }

  // Intercept Image.src & HTMLImageElement.prototype.src
  try {
    var imgDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (imgDesc && imgDesc.set) {
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        get: imgDesc.get,
        set: function(val) {
          imgDesc.set.call(this, resolveVfsUrl(val));
        },
        configurable: true,
        enumerable: true
      });
    }
  } catch (e) {}

  // Intercept Audio() constructor & HTMLMediaElement.prototype.src
  if (window.Audio) {
    var OrigAudio = window.Audio;
    window.Audio = function(src) {
      return new OrigAudio(src ? resolveVfsUrl(src) : undefined);
    };
    window.Audio.prototype = OrigAudio.prototype;
  }
  try {
    var mediaDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
    if (mediaDesc && mediaDesc.set) {
      Object.defineProperty(HTMLMediaElement.prototype, 'src', {
        get: mediaDesc.get,
        set: function(val) {
          mediaDesc.set.call(this, resolveVfsUrl(val));
        },
        configurable: true,
        enumerable: true
      });
    }
  } catch (e) {}

  // --- 2. Mock DOMRequest Helper (Gecko B2G Pattern) ---
  function createDOMRequest(resultValue, errorValue, delayMs) {
    var req = {
      readyState: 'pending',
      result: undefined,
      error: null,
      onsuccess: null,
      onerror: null,
      _listeners: { success: [], error: [] },
      addEventListener: function(type, cb) {
        if (this._listeners[type]) this._listeners[type].push(cb);
      },
      removeEventListener: function(type, cb) {
        if (!this._listeners[type]) return;
        this._listeners[type] = this._listeners[type].filter(function(fn) { return fn !== cb; });
      }
    };
    setTimeout(function() {
      req.readyState = 'done';
      if (errorValue) {
        req.error = typeof errorValue === 'string' ? { name: errorValue, message: errorValue } : errorValue;
        var errEvt = { type: 'error', target: req };
        if (typeof req.onerror === 'function') req.onerror(errEvt);
        req._listeners.error.forEach(function(fn) { fn(errEvt); });
      } else {
        req.result = resultValue;
        var okEvt = { type: 'success', target: req };
        if (typeof req.onsuccess === 'function') req.onsuccess(okEvt);
        req._listeners.success.forEach(function(fn) { fn(okEvt); });
      }
    }, delayMs || 5);
    return req;
  }

  // --- 3. Gecko / KaiOS 2.5 & 3.0 API Polyfills ---
  var appObject = {
    manifest: MANIFEST,
    updateManifest: null,
    manifestURL: 'app://kaios-runner.local/manifest.webapp',
    origin: 'app://kaios-runner.local',
    installOrigin: 'app://kaios-runner.local',
    installTime: Date.now(),
    removable: true,
    enabled: true,
    launch: function() {},
    checkForUpdate: function() { return createDOMRequest(false); },
    download: function() {},
    cancelDownload: function() {},
    connect: function() { return Promise.resolve([]); }
  };

  if (!navigator.mozApps) {
    navigator.mozApps = {
      getSelf: function() { return createDOMRequest(appObject); },
      checkInstalled: function() { return createDOMRequest(appObject); },
      getInstalled: function() { return createDOMRequest([appObject]); },
      install: function() { return createDOMRequest(appObject); },
      installPackage: function() { return createDOMRequest(appObject); },
      mgmt: {
        getAll: function() { return createDOMRequest([appObject]); },
        getNotInstalled: function() { return createDOMRequest([]); },
        uninstall: function() { return createDOMRequest(true); }
      }
    };
  }

  var messageHandlers = {};
  if (!navigator.mozSetMessageHandler) {
    navigator.mozSetMessageHandler = function(type, handler) {
      messageHandlers[type] = handler;
    };
  }
  if (!navigator.mozHasPendingMessage) {
    navigator.mozHasPendingMessage = function() {
      return false;
    };
  }

  // navigator.mozAlarms
  var alarmsStore = [];
  var nextAlarmId = 1;
  if (!navigator.mozAlarms) {
    navigator.mozAlarms = {
      getAll: function() {
        return createDOMRequest(alarmsStore.slice());
      },
      add: function(date, respectTimezone, data) {
        var id = nextAlarmId++;
        alarmsStore.push({ id: id, date: date, respectTimezone: respectTimezone, data: data || {} });
        return createDOMRequest(id);
      },
      remove: function(id) {
        alarmsStore = alarmsStore.filter(function(a) { return a.id !== id; });
      }
    };
  }

  // Virtual DeviceStorage backed by in-memory Map + localStorage persistence
  var virtualStoragePools = {};
  function getStoragePool(storageName) {
    if (!virtualStoragePools[storageName]) {
      virtualStoragePools[storageName] = new Map();
      // Hydrate persisted text/json items if available
      try {
        var prefix = 'kaios_ds_' + storageName + ':';
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(prefix) === 0) {
            var fileName = k.slice(prefix.length);
            var raw = localStorage.getItem(k);
            if (raw !== null) {
              var blob = new Blob([raw], { type: 'application/octet-stream' });
              blob.name = fileName;
              virtualStoragePools[storageName].set(fileName, blob);
            }
          }
        }
      } catch (e) {}
    }
    return virtualStoragePools[storageName];
  }

  function createDeviceStorageInstance(storageName) {
    var pool = getStoragePool(storageName);
    return {
      storageName: storageName,
      default: storageName === 'sdcard',
      canBeFormatted: false,
      canBeMounted: false,
      canBeShared: true,
      isRemovable: storageName === 'sdcard',
      add: function(blob) {
        var name = (blob && blob.name) ? blob.name : ('file_' + Date.now() + '.bin');
        return this.addNamed(blob, name);
      },
      addNamed: function(blob, name) {
        var cleanName = String(name).replace(/^\\/+/, '');
        var storedBlob = blob instanceof Blob ? blob : new Blob([String(blob)], { type: 'text/plain' });
        try { Object.defineProperty(storedBlob, 'name', { value: cleanName, configurable: true }); } catch (e) {}
        pool.set(cleanName, storedBlob);
        if (storedBlob.size < 262144 && storedBlob.text) {
          storedBlob.text().then(function(txt) {
            try { localStorage.setItem('kaios_ds_' + storageName + ':' + cleanName, txt); } catch (e) {}
          }).catch(function() {});
        }
        return createDOMRequest(cleanName);
      },
      get: function(name) {
        var cleanName = String(name).replace(/^\\/+/, '');
        if (pool.has(cleanName)) {
          return createDOMRequest(pool.get(cleanName));
        }
        return createDOMRequest(null, 'NotFoundError');
      },
      delete: function(name) {
        var cleanName = String(name).replace(/^\\/+/, '');
        pool.delete(cleanName);
        try { localStorage.removeItem('kaios_ds_' + storageName + ':' + cleanName); } catch (e) {}
        return createDOMRequest(cleanName);
      },
      enumerate: function(pathPrefix) {
        var files = [];
        pool.forEach(function(val, key) {

      <span class="badge">END</span>

    <div class="log-box" id="status-log">
      Use Arrows, Enter, * (LSK), # (RSK), or 0-9 keys.
    </div>
  </main>
  <footer>
    <span class="lsk" id="lsk-label">Clear</span>
    <span class="csk">Select</span>

        sampleZip.file('app.js', `
          (function() {
            var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
            var logEl = document.getElementById('status-log');
            var dialEl = document.getElementById('dial-buf');
            var titleEl = document.getElementById('app-title');
            var selectedIdx = 0;
            var digits = '';

            if (navigator.mozApps) {
              var req = navigator.mozApps.getSelf();
              req.onsuccess = function() {
                if (req.result && req.result.manifest) {
                  titleEl.textContent = req.result.manifest.name;
                }
              };
            }

            function renderSelection() {
              items.forEach(function(el, i) {
                el.classList.toggle('focused', i === selectedIdx);
              });
            }

            function runAction(action) {
              if (action === 'mozapps') {
                var r = navigator.mozApps.getSelf();
                r.onsuccess = function() {
                  logEl.textContent = 'mozApps OK: ' + r.result.manifest.name + ' v' + r.result.manifest.version;
                };
              } else if (action === 'storage') {
                var sd = navigator.getDeviceStorage('sdcard');
                var file = new Blob(['kaios-test-' + Date.now()], { type: 'text/plain' });
                var w = sd.addNamed(file, 'probe.txt');
                w.onsuccess = function() {
                  logEl.textContent = 'SD Saved: ' + w.result;
                };
              } else if (action === 'activity') {
                var act = new MozActivity({ name: 'share', data: { type: 'text/plain' } });
                act.onsuccess = function() {
                  logEl.textContent = 'MozActivity resolved!';
                };
              } else if (action === 'exit') {
                window.close();
              }
            }

            window.addEventListener('keydown', function(e) {
              if (e.key === 'ArrowDown') {
                selectedIdx = (selectedIdx + 1) % items.length;
                renderSelection();
              } else if (e.key === 'ArrowUp') {
                selectedIdx = (selectedIdx - 1 + items.length) % items.length;
                renderSelection();
              } else if (e.key === 'Enter') {
                runAction(items[selectedIdx].getAttribute('data-action'));
              } else if (e.key === 'SoftLeft') {
                digits = '';
                dialEl.textContent = '#';
                logEl.textContent = 'LSK (SoftLeft) pressed — Cleared';
              } else if (e.key === 'SoftRight') {
                logEl.textContent = 'RSK (SoftRight) pressed — Closing...';
                setTimeout(function() { window.close(); }, 250);
              } else if (e.key === 'Backspace') {
                if (digits.length > 0) {
                  digits = digits.slice(0, -1);
                  dialEl.textContent = digits || '#';
                } else {
                  logEl.textContent = 'Back key pressed';
                }
              } else if (/^[0-9]$/.test(e.key)) {
                digits = (digits + e.key).slice(-8);
                dialEl.textContent = digits;
                logEl.textContent = 'Key ' + e.key + ' pressed';
              }
            });
          })();
        `);

        const zipBlob = await sampleZip.generateAsync({ type: 'blob' });
        loadPackageSource(zipBlob, 'kaios-sample-app.zip');

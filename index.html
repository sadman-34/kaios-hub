<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaiOS Web App Runner</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#16171c; --line:#2a2d36;
    --fg:#e7e8ec; --dim:#8b909c; --accent:#6fb7ff; --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #rig{display:flex; flex-direction:column; align-items:center; gap:16px}

  /* ---------- the screen: exactly 240x320, no status bar, no bezel ---------- */
  #screen{
    position:relative; width:240px; height:320px;
    background:#000; overflow:hidden; outline:1px solid var(--line);
  }
  #frame{
    position:absolute; inset:0; width:240px; height:320px;
    border:0; display:block; background:#000;
  }
  #hint{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    text-align:center; padding:18px; background:#000;
    color:var(--dim); font-size:11px; pointer-events:none; line-height:1.5;
  }
  #hint.hidden{display:none}
  #hint b{color:var(--fg); font-size:12px; font-weight:600; letter-spacing:.2px}
  #hint em{font-style:normal; color:var(--accent)}
  #hint.err b{color:var(--danger)}

  /* ---------- controls (outside the screen) ---------- */
  #controls{display:flex; gap:8px}
  button{
    font:inherit; font-size:12px; font-weight:500;
    padding:7px 15px; border-radius:6px; cursor:pointer;
    background:var(--panel); color:var(--fg);
    border:1px solid var(--line);
    transition:background .12s, border-color .12s, transform .06s;
  }
  button:hover:not(:disabled){background:#1e2027; border-color:#3a3e4a}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.35; cursor:default}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>

<main id="rig">
  <div id="screen">
    <iframe id="frame" title="App" src="about:blank" allow="autoplay; fullscreen"></iframe>
    <div id="hint">
      <b>No app loaded</b>
      <span>Press <em>Load</em> and pick a<br>.zip, .omni or .html file</span>
    </div>
  </div>

  <div id="controls">
    <button id="btnLoad"   type="button">Load</button>
    <button id="btnReload" type="button" disabled>Reload</button>
    <button id="btnEject"  type="button" disabled>Eject</button>
  </div>

  <input id="file" type="file" accept=".zip,.omni,.html,.htm,application/zip" hidden>
</main>

<script>
(function () {
  'use strict';

  /* =====================================================================
     DOM + state
     ===================================================================== */
  const frame     = document.getElementById('frame');
  const hint      = document.getElementById('hint');
  const btnLoad   = document.getElementById('btnLoad');
  const btnReload = document.getElementById('btnReload');
  const btnEject  = document.getElementById('btnEject');
  const fileInput = document.getElementById('file');

  const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';

  /** @type {{entryUrl:string, entryHtml:string, urls:string[], manifest:object, entryPath:string, sourceName:string}|null} */
  let current = null;
  let busy = false;

  /* =====================================================================
     Small helpers
     ===================================================================== */
  const MIME = {
    html:'text/html', htm:'text/html', js:'text/javascript', mjs:'text/javascript',
    css:'text/css', json:'application/json', webapp:'application/json',
    png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
    svg:'image/svg+xml', webp:'image/webp', ico:'image/x-icon', bmp:'image/bmp',
    woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf',
    eot:'application/vnd.ms-fontobject',
    mp3:'audio/mpeg', ogg:'audio/ogg', oga:'audio/ogg', wav:'audio/wav', m4a:'audio/mp4',
    mp4:'video/mp4', webm:'video/webm',
    txt:'text/plain', xml:'application/xml', vtt:'text/vtt'
  };

  const ext      = p => { const m = /\.([a-z0-9]+)$/i.exec(p); return m ? m[1].toLowerCase() : ''; };
  const mimeFor  = p => MIME[ext(p)] || 'application/octet-stream';
  const dirname  = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i + 1); };
  const slug     = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'runner';

  function normalizePath(p) {
    const out = [];
    for (const seg of String(p).replace(/\\/g, '/').split('/')) {
      if (!seg || seg === '.') continue;
      if (seg === '..') out.pop();
      else out.push(seg);
    }
    return out.join('/');
  }

  function resolvePath(baseDir, rel) {
    let v = String(rel || '').split('#')[0].split('?')[0];
    if (!v) return null;
    return v.startsWith('/')
      ? normalizePath(baseDir + v.slice(1))
      : normalizePath(baseDir + v);
  }

  function findCI(files, path) {
    if (files.has(path)) return path;
    const lower = String(path).toLowerCase();
    for (const k of files.keys()) if (k.toLowerCase() === lower) return k;
    return null;
  }

  function safeJson(o) {
    return JSON.stringify(o)
      .replace(/</g, '\\u003c')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
  }

  /* =====================================================================
     URL resolution: relative asset  ->  blob: URL
     ===================================================================== */
  function mapUrl(raw, dir, urls, baseDir) {
    if (!raw) return null;
    let v = String(raw).trim();
    if (!v) return null;
    // leave absolute / external / data / anchor references alone
    if (/^(?:[a-z][a-z0-9+.\-]*:|\/\/|#)/i.test(v)) return null;

    v = v.split('#')[0].split('?')[0];
    if (!v) return null;

    const path = v.startsWith('/')
      ? normalizePath(baseDir + v.slice(1))
      : normalizePath(dir + v);

    const candidates = [path];
    try {
      const decoded = decodeURIComponent(path);
      if (decoded !== path) candidates.push(decoded);
    } catch (e) { /* malformed escape — ignore */ }

    for (const c of candidates) {
      const u = urls.get(c);
      if (u) return u;
    }
    return null;
  }

  function rewriteCss(text, dir, urls, baseDir) {
    if (!text) return text;
    text = text.replace(/url\(\s*(['"]?)([^'")]*)\1\s*\)/gi, (m, q, raw) => {
      const u = mapUrl(raw, dir, urls, baseDir);
      return u ? 'url("' + u + '")' : m;
    });
    text = text.replace(/@import\s+(['"])([^'"]+)\1/gi, (m, q, raw) => {
      const u = mapUrl(raw, dir, urls, baseDir);
      return u ? '@import url("' + u + '")' : m;
    });
    return text;
  }

  function rewriteHtml(text, dir, urls, baseDir, appInfo) {
    const doc = new DOMParser().parseFromString(text, 'text/html');

    // a <base> would defeat every rewrite below
    doc.querySelectorAll('base').forEach(el => el.remove());

    const targets = [
      ['img', 'src'],       ['img', 'srcset'],
      ['script', 'src'],    ['link', 'href'],
      ['source', 'src'],    ['source', 'srcset'],
      ['audio', 'src'],     ['video', 'src'],   ['video', 'poster'],
      ['track', 'src'],     ['embed', 'src'],   ['object', 'data'],
      ['input', 'src'],
      ['use', 'href'],      ['use', 'xlink:href'],
      ['image', 'href'],    ['image', 'xlink:href']
    ];

    for (const [sel, attr] of targets) {
      doc.querySelectorAll(sel).forEach(el => {
        const raw = el.getAttribute(attr);
        if (!raw) return;

        if (attr === 'srcset') {
          el.setAttribute(attr, raw.split(',').map(part => {
            const bits = part.trim().split(/\s+/);
            const u = mapUrl(bits[0], dir, urls, baseDir);
            if (u) bits[0] = u;
            return bits.join(' ');
          }).join(', '));
          return;
        }

        const u = mapUrl(raw, dir, urls, baseDir);
        if (u) el.setAttribute(attr, u);
      });
    }

    // inline + embedded CSS
    doc.querySelectorAll('style').forEach(el => {
      el.textContent = rewriteCss(el.textContent, dir, urls, baseDir);
    });
    doc.querySelectorAll('[style]').forEach(el => {
      el.setAttribute('style', rewriteCss(el.getAttribute('style'), dir, urls, baseDir));
    });

    /* ---- inject the KaiOS shim FIRST so it precedes every app script ---- */
    if (appInfo) {
      const head = doc.head || doc.documentElement;
      const nodes = [];

      const meta = doc.createElement('meta');
      meta.setAttribute('charset', 'utf-8');
      nodes.push(meta);

      const info = doc.createElement('script');
      info.textContent = 'window.__KAIOS_APP__=' + safeJson(appInfo) + ';';
      nodes.push(info);

      const shim = doc.createElement('script');
      shim.textContent = '(' + kaiosShim.toString() + ')();';
      nodes.push(shim);

      const ref = head.firstChild;
      for (const n of nodes) head.insertBefore(n, ref);
    }

    const doctype = doc.doctype ? '<!DOCTYPE ' + doc.doctype.name + '>' : '<!DOCTYPE html>';
    return doctype + '\n' + doc.documentElement.outerHTML;
  }

  /* =====================================================================
     THE SHIM — stringified and injected before app scripts.
     Must be fully self-contained (no closures over host variables).
     ===================================================================== */
  function kaiosShim() {
    var W = window;
    var INFO = W.__KAIOS_APP__ ||
      { manifest: {}, manifestURL: 'app://runner/manifest.webapp', origin: 'app://runner' };

    function post(m) { try { parent.postMessage(m, '*'); } catch (e) {} }
    function defer(fn) { setTimeout(fn, 0); }

    /* ---------------- DOMRequest ---------------- */
    function mkRequest() {
      var r = {
        result: undefined, error: null, readyState: 'pending',
        onsuccess: null, onerror: null, _h: {},
        addEventListener: function (t, f) { (r._h[t] = r._h[t] || []).push(f); },
        removeEventListener: function (t, f) {
          var a = r._h[t]; if (!a) return;
          var i = a.indexOf(f); if (i >= 0) a.splice(i, 1);
        }
      };
      r._fire = function (type) {
        var ev = { type: type, target: r };
        var h = r['on' + type];
        if (typeof h === 'function') { try { h.call(r, ev); } catch (e) { console.error(e); } }
        var a = (r._h[type] || []).slice();
        for (var i = 0; i < a.length; i++) {
          try { a[i].call(r, ev); } catch (e) { console.error(e); }
        }
      };
      return r;
    }
    function ok(r, v) { defer(function () { r.readyState = 'done'; r.result = v; r._fire('success'); }); return r; }
    function fail(r, e) {
      defer(function () {
        r.readyState = 'done';
        r.error = e || { name: 'UnknownError', message: '' };
        r._fire('error');
      });
      return r;
    }

    /* ---------------- DOMCursor ---------------- */
    function mkCursor(items) {
      var i = 0;
      var c = {
        done: false, result: null, onsuccess: null, onerror: null, _h: {},
        addEventListener: function (t, f) { (c._h[t] = c._h[t] || []).push(f); },
        removeEventListener: function () {},
        'continue': function () {
          defer(function () {
            if (i >= items.length) { c.done = true; c.result = null; }
            else { c.result = items[i++]; }
            var ev = { type: 'success', target: c };
            if (typeof c.onsuccess === 'function') { try { c.onsuccess(ev); } catch (e) { console.error(e); } }
            var a = (c._h.success || []).slice();
            for (var k = 0; k < a.length; k++) { try { a[k](ev); } catch (e) {} }
          });
        }
      };
      return c;
    }

    /* ---------------- navigator.mozApps ---------------- */
    function KaiApp(manifest, manifestURL, origin) {
      this.manifest = manifest || {};
      this.manifestURL = manifestURL;
      this.origin = origin;
      this.installOrigin = origin;
      this.installTime = Date.now();
      this.appStatus = 1;
      this.receipts = [];
    }
    KaiApp.prototype.launch = function () { post({ type: 'kaios:launch', manifestURL: this.manifestURL }); };
    KaiApp.prototype.close = function () { post({ type: 'kaios:close' }); };
    KaiApp.prototype.uninstall = function () { return ok(mkRequest(), undefined); };
    KaiApp.prototype.checkForUpdate = function () { return ok(mkRequest(), null); };
    KaiApp.prototype.addEventListener = function () {};
    KaiApp.prototype.removeEventListener = function () {};

    var selfApp = new KaiApp(INFO.manifest, INFO.manifestURL, INFO.origin);

    try {
      navigator.mozApps = {
        getSelf: function () { return ok(mkRequest(), selfApp); },
        getInstalled: function () { return ok(mkRequest(), [selfApp]); },
        checkInstalled: function () { return ok(mkRequest(), selfApp); },
        getSelfSync: function () { return selfApp; },
        install: function (url, manifestUrl) {
          post({ type: 'kaios:install', url: url, manifestUrl: manifestUrl });
          return ok(mkRequest(), selfApp);
        }
      };
    } catch (e) { /* navigator frozen — ignore */ }

    /* ---------------- system message handlers ---------------- */
    var handlers = {};
    function setMessageHandler(type, fn) {
      if (typeof fn === 'function') handlers[type] = fn;
      else delete handlers[type];
    }
    W.mozSetMessageHandler = setMessageHandler;
    try { navigator.mozSetMessageHandler = setMessageHandler; } catch (e) {}

    W.mozHasPendingMessage = function () { return false; };
    try { navigator.mozHasPendingMessage = W.mozHasPendingMessage; } catch (e) {}

    W.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || typeof d !== 'object' || d.type !== 'kaios:message') return;
      var h = handlers[d.name];
      if (typeof h === 'function') {
        try { h(d.data); } catch (err) { console.error(err); }
      }
    });

    /* ---------------- navigator.getDeviceStorage ---------------- */
    var storages = {};
    function makeStorage(name) {
      var files = Object.create(null);

      function list(prefix) {
        var out = [];
        for (var k in files) {
          if (!prefix || k.indexOf(prefix) === 0) {
            out.push({
              name: k, storageName: name,
              lastModified: new Date(),
              size: files[k] && files[k].size || 0
            });
          }
        }
        return out;
      }

      var api = {
        storageName: name,
        onchange: null,
        available: function () { return ok(mkRequest(), 'available'); },
        freeSpace: function () { return ok(mkRequest(), 64 * 1024 * 1024); },
        usedSpace: function () { return ok(mkRequest(), 0); },
        add: function (n, blob) { files[n] = blob; return ok(mkRequest(), n); },
        addNamed: function (blob, n) { return api.add(n, blob); },
        get: function (n) {
          var r = mkRequest();
          return (n in files) ? ok(r, files[n]) : fail(r, { name: 'NotFoundError', message: String(n) });
        },
        getEditable: function (n) { return api.get(n); },
        'delete': function (n) { delete files[n]; return ok(mkRequest(), undefined); },
        enumerate: function (prefix) { return ok(mkRequest(), mkCursor(list(prefix))); },
        enumerateEditable: function (prefix) { return api.enumerate(prefix); }
      };
      return api;
    }

    try {
      navigator.getDeviceStorage = function (name) {
        name = String(name || 'sdcard');
        if (!storages[name]) storages[name] = makeStorage(name);
        return storages[name];
      };
    } catch (e) {}

    /* ---------------- MozActivity ---------------- */
    /* ---------------- Fake mozL10n (Language) ---------------- */
    if (!navigator.mozL10n) {
      navigator.mozL10n = {
        get: function (key) { return key; },
        setLanguage: function () { return Promise.resolve(); },
        ready: Promise.resolve(),
        once: function () { return Promise.resolve(); },
        language: { code: 'en-US', direction: 'ltr' }
      };
    }
    W.mozL10n = navigator.mozL10n;

    /* ---------------- Fake mozSettings ---------------- */
    if (!navigator.mozSettings) {
      navigator.mozSettings = {
        createLock: function () {
          return {
            get: function (key) {
              var r = mkRequest();
              var res = {}; res[key] = null;
              return ok(r, res);
            },
            set: function (obj) { return ok(mkRequest(), undefined); }
          };
        },
        addObserver: function () {}
      };
    }
    /* ---------------- Fake Service Worker ---------------- */
    try {
      if (!navigator.serviceWorker) {
        navigator.serviceWorker = {
          register: function () { return Promise.resolve({ scope: '/' }); },
          getRegistration: function () { return Promise.resolve(undefined); },
          ready: Promise.resolve({ active: {} }),
          addEventListener: function () {}, removeEventListener: function () {}
        };
      }
    } catch (e) {}

    /* ---------------- Catch Silent Promise Errors ---------------- */
    W.addEventListener('unhandledrejection', function (e) {
      post({
        type: 'kaios:error',
        message: 'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))
      });
    });

    /* ---------------- Fix Local File Fetching ---------------- */
    var URLS = INFO.urls || {};
    var origFetch = W.fetch;
    W.fetch = function (input, init) {
      if (typeof input === 'string') {
        var clean = input.replace(/^\.\//, '').replace(/^\//, '');
        if (URLS[clean]) input = URLS[clean];
      }
      return origFetch.call(W, input, init);
    };
    var origXHR = W.XMLHttpRequest.prototype.open;
    W.XMLHttpRequest.prototype.open = function (method, url, async, user, password) {
      if (typeof url === 'string') {
        var clean = url.replace(/^\.\//, '').replace(/^\//, '');
        if (URLS[clean]) url = URLS[clean];
      }
      return origXHR.call(this, method, url, async, user, password);
    };
    var origLog = console.log;
    console.log = function () {
      var msg = Array.prototype.slice.call(arguments).join(' ');
      post({ type: 'kaios:log', msg: msg });
      origLog.apply(console, arguments);
    };	
        /* ---------------- catch app crashes ---------------- */
    W.addEventListener('error', function (e) {
      post({
        type: 'kaios:error',
        message: e.message || 'Unknown script error',
        filename: e.filename || '',
        lineno: e.lineno || 0
      });
    });
	W.MozActivity = function (cfg) {
      var self = this;
      this.source = (cfg && cfg.source) || {};
      this.onsuccess = null;
      this.onerror = null;
      post({
        type: 'kaios:activity',
        name: (cfg && cfg.name) || '',
        detail: (cfg && cfg.data) || {}
      });
      defer(function () {
        if (typeof self.onsuccess === 'function') self.onsuccess({ type: 'success', target: self });
      });
    };

    /* ---------------- window.close() ---------------- */
    W.close = function () { post({ type: 'kaios:close' }); };

    /* ---------------- physical key  ->  KaiOS key ---------------- */
    var KEYMAP = {
      '*': 'SoftLeft',        // LSK
      '#': 'SoftRight',       // RSK
      'ArrowUp': 'ArrowUp', 'ArrowDown': 'ArrowDown',
      'ArrowLeft': 'ArrowLeft', 'ArrowRight': 'ArrowRight',
      'Enter': 'Enter',
      'Backspace': 'Backspace',
      'Escape': 'Backspace',  // Back
      // desktop conveniences
      'F1': 'SoftLeft', 'F2': 'SoftRight'
    };
    for (var d = 0; d <= 9; d++) KEYMAP[String(d)] = String(d);

    var synthesizing = false;

    function onKey(e) {
      if (synthesizing) return;

      var mapped = KEYMAP[e.key];
      if (!mapped) return;          // not a KaiOS key — let it through
      if (mapped === e.key) return; // identity mapping — native behaviour is correct

      e.preventDefault();
      e.stopPropagation();

      var target = document.activeElement || document.body || document.documentElement;
      synthesizing = true;
      try {
        target.dispatchEvent(new KeyboardEvent(e.type, {
          key: mapped,
          code: mapped,
          bubbles: true,
          cancelable: true,
          view: W,
          repeat: e.repeat,
          ctrlKey: e.ctrlKey,
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          metaKey: e.metaKey
        }));
      } catch (err) {
        console.error(err);
      }
      synthesizing = false;
    }

    W.addEventListener('keydown', onKey, true);
    W.addEventListener('keyup', onKey, true);

    /* ---------------- keep the frame focused ---------------- */
    W.addEventListener('blur', function () {
      defer(function () {
        if (typeof document.hasFocus === 'function' && document.hasFocus()) return;
        try { W.focus(); } catch (e) {}
      });
    });
  }

  /* =====================================================================
     Package -> runnable app
     ===================================================================== */
  async function buildApp(files, opts) {
    const manifestPath = opts.manifestPath || null;
    let manifest = {};
    let baseDir = '';
    let entryPath = null;

    if (manifestPath && files.has(manifestPath)) {
      baseDir = dirname(manifestPath);
      try {
        manifest = JSON.parse(await files.get(manifestPath).text());
      } catch (e) {
        console.warn('[runner] manifest.webapp is not valid JSON', e);
        manifest = {};
      }
      const lp = manifest.launch_path || manifest.launchPath || '/index.html';
      let candidate = resolvePath(baseDir, lp);
      if (candidate) candidate = findCI(files, candidate);
      if (candidate) entryPath = candidate;
    }

    if (!entryPath) {
      const htmls = [...files.keys()]
        .filter(p => /\.html?$/i.test(p))
        .sort((a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b));
      entryPath = htmls[0] || null;
    }
        if (!entryPath) {
      const found = Array.from(files.keys()).slice(0, 20).join(', ');
      throw new Error('No HTML found. Contains: ' + found);
    }
    if (!baseDir) baseDir = dirname(entryPath);

    const urls = new Map();     // path -> blob: URL
    const created = [];         // for later revoking
    const mk = blob => {
      const u = URL.createObjectURL(blob);
      created.push(u);
      return u;
    };

    /* --- pass A: binary / script assets --- */
    for (const [p, blob] of files) {
      if (/\.(css|html?)$/i.test(p)) continue;
      urls.set(p, mk(blob));
    }

    /* --- pass B: stylesheets (url() / @import resolved) --- */
    for (const [p, blob] of files) {
      if (!/\.css$/i.test(p)) continue;
      const css = rewriteCss(await blob.text(), dirname(p), urls, baseDir);
      urls.set(p, mk(new Blob([css], { type: 'text/css;charset=utf-8' })));
    }

    /* --- pass C: documents (assets resolved + shim injected on the entry) --- */
    const appSlug = slug(manifest.name || opts.sourceName || 'app');
        const appInfo = {
      manifest: manifest,
      manifestURL: 'app://' + appSlug + '/manifest.webapp',
      origin: 'app://' + appSlug,
      urls: {}
    };

    for (const [k, v] of urls) {
      appInfo.urls[k] = v;
    }

    let entryUrl = null;
    let entryHtml = null;

    for (const [p, blob] of files) {
      if (!/\.html?$/i.test(p)) continue;
      const isEntry = p === entryPath;
      const html = rewriteHtml(
        await blob.text(), dirname(p), urls, baseDir,
        isEntry ? appInfo : null
      );
      const url = mk(new Blob([html], { type: 'text/html;charset=utf-8' }));
      urls.set(p, url);
      if (isEntry) { entryUrl = url; entryHtml = html; }
    }

    if (!entryUrl) throw new Error('Entry document could not be prepared.');

    return {
      entryUrl, entryHtml, urls: created,
      manifest, entryPath, sourceName: opts.sourceName || entryPath
    };
  }

  /* =====================================================================
     JSZip lazy loader
     ===================================================================== */
  let jszipPromise = null;
  function loadJSZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (jszipPromise) return jszipPromise;
    jszipPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = JSZIP_URL;
      s.onload = () => window.JSZip ? resolve(window.JSZip) : reject(new Error('JSZip unavailable'));
      s.onerror = () => reject(new Error('Could not fetch JSZip (offline?)'));
      document.head.appendChild(s);
    });
    return jszipPromise;
  }

  /* =====================================================================
     File ingestion
     ===================================================================== */
  async function openFile(file) {
    if (!file || busy) return;
    busy = true;
    setControlsDisabled(true);

    if (!current) showHint('Unpacking…', file.name);

    try {
      const name = file.name || 'app';
      const lower = name.toLowerCase();
      const files = new Map();
      let manifestPath = null;

      if (lower.endsWith('.html') || lower.endsWith('.htm')) {
        files.set(name, new Blob([await file.text()], { type: 'text/html;charset=utf-8' }));
              } else {
          const JSZip = await loadJSZip();
          let zip = await JSZip.loadAsync(file);

          // Auto-unwrap KaiOS store packages (application.zip)
          if (zip.files['application.zip'] && !zip.files['application.zip'].dir) {
            const innerData = await zip.files['application.zip'].async('blob');
            zip = await JSZip.loadAsync(innerData);
          }

          const entries = [];
          zip.forEach((path, entry) => {
          if (entry.dir) return;
          if (path.startsWith('__MACOSX/')) return;
          const base = path.split('/').pop();
          if (base === '.DS_Store' || base === 'Thumbs.db') return;
          entries.push([path, entry]);
        });
        if (!entries.length) throw new Error('Archive is empty.');

        for (const [path, entry] of entries) {
          const p = normalizePath(path);
          const data = await entry.async('blob');
          files.set(p, new Blob([data], { type: mimeFor(p) }));
        }
        manifestPath = findManifest(files);
      }

      const built = await buildApp(files, { manifestPath, sourceName: name });
      mount(built);

    } catch (err) {
      console.error('[runner]', err);
      if (!current) {
        showHint('Could not load', String((err && err.message) || err), true);
      }
    } finally {
      busy = false;
      setControlsDisabled(false);
    }
  }

  function findManifest(files) {
    let best = null;
    for (const p of files.keys()) {
      if (!p.toLowerCase().endsWith('manifest.webapp')) continue;
      if (!best || p.split('/').length < best.split('/').length) best = p;
    }
    return best;
  }

  /* =====================================================================
     Mount / reload / eject
     ===================================================================== */
  function mount(built) {
    if (current) revokeAll(current.urls);

    current = built;
    frame.src = built.entryUrl;

    hint.classList.add('hidden');
    hint.classList.remove('err');
    btnReload.disabled = false;
    btnEject.disabled = false;
  }

  function reload() {
    if (!current || busy) return;
    const oldUrl = current.entryUrl;
    const url = URL.createObjectURL(
      new Blob([current.entryHtml], { type: 'text/html;charset=utf-8' })
    );
    current.urls.push(url);
    current.entryUrl = url;
    frame.src = url;
    setTimeout(() => { try { URL.revokeObjectURL(oldUrl); } catch (e) {} }, 1500);
  }

  function eject() {
    if (!current) return;
    const urls = current.urls;
    current = null;

    frame.src = 'about:blank';
    setTimeout(() => revokeAll(urls), 500);

    btnReload.disabled = true;
    btnEject.disabled = true;
    showHint('No app loaded', 'Press Load and pick a .zip, .omni or .html file');
  }

  function revokeAll(urls) {
    (urls || []).forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
  }

  /* =====================================================================
     Screen hint
     ===================================================================== */
  function showHint(title, sub, isError) {
    hint.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = title;
    const s = document.createElement('span');
    s.textContent = sub || '';
    hint.append(b, s);
    hint.classList.toggle('err', !!isError);
    hint.classList.remove('hidden');
  }

  function setControlsDisabled(loading) {
    btnLoad.disabled = loading;
    if (loading) {
      btnReload.disabled = true;
      btnEject.disabled = true;
    } else {
      btnReload.disabled = !current;
      btnEject.disabled = !current;
    }
  }

  /* =====================================================================
     Focus lock — keep keyboard input inside the frame
     ===================================================================== */
  function focusFrame() {
    if (!current) return;
    try {
      frame.focus();
      if (frame.contentWindow) frame.contentWindow.focus();
    } catch (e) { /* cross-origin guard */ }
  }

  // If focus ever escapes to the host chrome, pull it straight back.
  document.addEventListener('keydown', function (e) {
    if (!current) return;
    if (document.activeElement === frame) return;
    focusFrame();
  }, true);

  // Clicking anywhere on the screen re-arms the frame.
  document.getElementById('screen').addEventListener('pointerdown', function () {
    setTimeout(focusFrame, 0);
  });

  frame.addEventListener('load', function () {
    if (!current) return;
    focusFrame();
  });

  /* =====================================================================
     Messages coming back out of the frame
     ===================================================================== */
  window.addEventListener('message', function (e) {
    const d = e.data;
    if (!d || typeof d !== 'object' || typeof d.type !== 'string') return;
    if (d.type.indexOf('kaios:') !== 0) return;

    switch (d.type) {
	      case 'kaios:log':
        showHint('App Log', d.msg);
        break;
      case 'kaios:error':
        // If the app crashes, show the error on the screen
        showHint('App Crashed', d.message + ' (Line ' + d.lineno + ')', true);
        break;
	  case 'kaios:close':          // app called window.close()
        eject();
        break;
      case 'kaios:launch':
        console.info('[mozApps] launch', d.manifestURL);
        break;
      case 'kaios:install':
        console.info('[mozApps] install', d.url, d.manifestUrl);
        break;
      case 'kaios:activity':
        console.info('[MozActivity]', d.name, d.detail);
        break;
    }
  });

  /* =====================================================================
     Wiring
     ===================================================================== */
  btnLoad.addEventListener('click', () => fileInput.click());
  btnReload.addEventListener('click', reload);
  btnEject.addEventListener('click', eject);

  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (f) openFile(f);
  });

  // drag & drop onto the window
  ['dragenter', 'dragover'].forEach(t =>
    document.addEventListener(t, e => { e.preventDefault(); })
  );
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });

  /* init */
  setControlsDisabled(false);
})();
</script>
</body>
</html>
